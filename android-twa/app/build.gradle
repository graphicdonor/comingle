// WePray for Android: a Trusted Web Activity that opens https://www.wepray.in/app
// full screen. It ships as an update to the existing Play listing
// (in.wepray.app), signed with the same upload key, so all content and
// features come from the website and update without a new release.
//
// Release signing reads WEPRAY_UPLOAD_* from ~/.gradle/gradle.properties
// (the same upload key as the earlier native app; never committed).

plugins {
    id "com.android.application"
}

def siteHost = "www.wepray.in"
def launchUrl = "https://www.wepray.in/app"

android {
    namespace "app.wepray.launcher"
    compileSdk 36

    defaultConfig {
        applicationId "in.wepray.app"
        minSdk 24
        targetSdk 36
        // Play: the native community app was versionCode 2 (1.0.0); 3 was
        // uploaded first, 4 marks the portrait screen as optional.
        versionCode 4
        versionName "2.0.0"
        manifestPlaceholders = [siteHost: siteHost, launchUrl: launchUrl]
        resValue "string", "app_name", "WePray"
        resValue "string", "asset_statements",
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${siteHost}\\\" } }]"
    }

    signingConfigs {
        release {
            if (project.hasProperty("WEPRAY_UPLOAD_STORE_FILE")) {
                storeFile file(WEPRAY_UPLOAD_STORE_FILE)
                storePassword WEPRAY_UPLOAD_STORE_PASSWORD
                keyAlias WEPRAY_UPLOAD_KEY_ALIAS
                keyPassword WEPRAY_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty("WEPRAY_UPLOAD_STORE_FILE")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
